name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract and Locate Project
      run: |
        # فك ضغط أي ملف مضغوط موجود
        for f in *.zip; do
          if [ -f "$f" ]; then
            unzip -o "$f" || true
          fi
        done
        
        # البحث عن مكان ملف gradlew أينما وجد ونقله للجذر الرئيسي تلقائياً
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $PROJECT_DIR"
          if [ "$PROJECT_DIR" != "." ]; then
            cp -r "$PROJECT_DIR"/* .
          fi
        else
          echo "Error: gradlew not found anywhere!"
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK result
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
