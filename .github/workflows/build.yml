name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip and fix paths automatically
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
        fi
        # نقل الملفات تلقائياً إلى الجذر الرئيسي إذا كانت داخل مجلد فرعي
        SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        if [ "$SUBDIR" != "." ] && [ -n "$SUBDIR" ]; then
          echo "Moving files from $SUBDIR to root"
          cp -r $SUBDIR/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK result
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
