name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract zip safely
      run: |
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Extracting: $f"
            unzip -o "$f" || true
          fi
        done
        # البحث عن مجلد المشروع ونقل محتواه للجذر إذا لزم الأمر
        TARGET_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
        if [ "$TARGET_DIR" != "." ] && [ -n "$TARGET_DIR" ]; then
          echo "Moving files from $TARGET_DIR to root"
          cp -r $TARGET_DIR/* . || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK result
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
